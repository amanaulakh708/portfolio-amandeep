<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UPI Payment</title>

<style>
body{
    font-family:Arial;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:350px;
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
    text-align:center;
}

button{
    width:100%;
    padding:15px;
    font-size:18px;
    border:none;
    border-radius:10px;
    background:#0F9D58;
    color:white;
    cursor:pointer;
}

#status{
    margin-top:20px;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="card">

<h2>Pay ₹100</h2>

<p>Merchant : Aman Apps</p>

<button onclick="startPayment()">
Pay with UPI
</button>

<div id="status"></div>

</div>

<script>

function startPayment(){

    document.getElementById("status").innerHTML="Opening UPI App...";

    const upi =
        "upi://pay" +
        "?pa=7082244101@okbizaxis" +
        "&pn=Aman Singh" +
        "&am=10" +
        "&cu=INR" +
        "&tn=Order123";

    window.location.href = upi;

    // Browser loses control here.

}

document.addEventListener("visibilitychange",function(){

    if(document.visibilityState==="hidden"){
        console.log("User switched to UPI App");
    }

    if(document.visibilityState==="visible"){
        document.getElementById("status").innerHTML=
        "Welcome back.<br>Please check whether your payment was successful.";
    }

});

window.addEventListener("focus",function(){

    console.log("Browser focused again");

});

</script>

</body>
</html>
