<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPI Payment Demo</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:350px;
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
    text-align:center;
}

h2{
    margin-bottom:10px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    background:#0F9D58;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#0b8043;
}

#status{
    margin-top:20px;
    color:#333;
}
</style>
</head>
<body>

<div class="card">

<h2>UPI Payment</h2>

<input
id="amount"
type="number"
placeholder="Amount"
value="100">

<button onclick="pay()">
Pay Now
</button>

<div id="status"></div>

</div>

<script>

const upiId="7082244101@okbizaxis";      // Example: aman@ybl
const merchantName="Amandeep Singh";

function pay(){

    const amount=document.getElementById("amount").value;

    if(amount==="" || Number(amount)<=0){
        alert("Enter valid amount");
        return;
    }

    const txnId="TXN"+Date.now();

    const url=
        "upi://pay"+
        "?pa="+encodeURIComponent(upiId)+
        "&pn="+encodeURIComponent(merchantName)+
        "&tr="+encodeURIComponent(txnId)+
        "&tn="+encodeURIComponent("Order Payment")+
        "&am="+encodeURIComponent(amount)+
        "&cu=INR";

    document.getElementById("status").innerHTML="Opening UPI App...";

    window.location.href=url;
}

document.addEventListener("visibilitychange",function(){

    if(document.visibilityState==="visible"){
        document.getElementById("status").innerHTML=
        "Returned from UPI app.<br>Please verify your payment status.";
    }

});

</script>

</body>
</html>
